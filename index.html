
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FASHION PRICE｜ファッション価格比較</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;color:#171a21;line-height:1.55;background:#fff}
header{border-bottom:1px solid #d8dee8;background:#fff}
.wrap,main{max-width:1080px;margin:auto;padding:18px 20px}
.logo{font-size:25px;font-weight:800}
.logo span{color:#0759c7}
.muted{color:#5d6675;font-size:13px}
h1{font-size:24px;margin:12px 0 5px}
.search{display:flex;gap:8px;margin:22px 0 12px}
.search input{flex:1;min-width:0;padding:13px;border:1px solid #9ba6b5;border-radius:6px;font-size:16px}
.search button{background:#0759c7;color:white;border:0;border-radius:6px;padding:0 22px;font-weight:bold;cursor:pointer}
.filters{display:flex;gap:15px;flex-wrap:wrap;margin:15px 0}
.filters select{padding:8px;border:1px solid #d8dee8;border-radius:5px;background:white}
.notice{background:#f0f6ff;border:1px solid #c7dcff;border-radius:6px;padding:11px;font-size:13px;margin:18px 0}
.head{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #222;padding-bottom:9px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{border:1px solid #d8dee8;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.photo{height:190px;background:#f0f2f5;display:grid;place-items:center;color:#77808d;font-size:13px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain}
.body{padding:14px;display:flex;flex-direction:column;flex:1;min-width:0}
.brand{font-size:12px;color:#5d6675}
.name{font-weight:bold;margin:4px 0 8px;overflow-wrap:anywhere}
.code{font-size:12px;color:#5d6675;margin:4px 0;overflow-wrap:anywhere}
.brand-code{font-size:13px;color:#171a21;font-weight:bold}
.price{font-size:22px;font-weight:bold;margin:8px 0}
.chip{font-size:11px;background:#eef2f7;padding:3px 7px;border-radius:4px;align-self:flex-start;margin-top:8px}
.detail{margin-top:13px;padding:9px;border:1px solid #0759c7;background:white;color:#0759c7;border-radius:5px;font-weight:bold;cursor:pointer}
.detail:hover{background:#f0f6ff}
.empty{padding:30px;text-align:center;color:#5d6675;border:1px dashed #d8dee8;border-radius:6px;grid-column:1/-1}
footer{text-align:center;border-top:1px solid #d8dee8;padding:20px;color:#5d6675;font-size:12px;margin-top:30px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.open{display:flex}
.dialog{background:white;border-radius:10px;padding:22px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.close{float:right;padding:6px;border:0;border-radius:5px;cursor:pointer}
.product-link{display:block;margin-top:14px;padding:12px;text-align:center;background:#0759c7;color:white;text-decoration:none;border-radius:5px;font-weight:bold}
.product-link:hover{background:#0649a3}
@media(max-width:700px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .photo{height:155px}
 .body{padding:10px}
 .price{font-size:20px}
}
@media(max-width:460px){
 .grid{grid-template-columns:1fr}
 .wrap,main{padding:14px}
 .filters{display:grid;gap:10px}
 .filters label{display:flex;justify-content:space-between;align-items:center;gap:12px}
 .filters select{max-width:65%;flex:1}
 .search button{padding:0 14px}
 .photo{height:220px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">FASHION <span>PRICE</span></div>
    <div class="muted">ファッションアイテムの価格比較</div>
  </div>
</header>

<main>
  <h1>欲しい服を、価格で比べる。</h1>
  <div class="muted">商品名やブランド名で検索して、価格をチェック。</div>

  <form class="search" id="searchForm">
    <input id="query" type="search" placeholder="例：デニム、バッグ、AZUL、ブランド品番" aria-label="商品名やブランド名">
    <button type="submit">検索</button>
  </form>

  <div class="filters">
    <label>カテゴリ
      <select id="category">
        <option value="">すべて</option>
        <option value="トップス">トップス</option>
        <option value="パンツ">パンツ</option>
        <option value="バッグ">バッグ</option>
        <option value="シューズ">シューズ</option>
      </select>
    </label>
    <label>対象
      <select id="gender">
        <option value="">すべて</option>
        <option value="レディース">レディース</option>
        <option value="メンズ">メンズ</option>
      </select>
    </label>
    <label>並び順
      <select id="sort">
        <option value="relevance">おすすめ順</option>
        <option value="low">価格が安い順</option>
        <option value="high">価格が高い順</option>
      </select>
    </label>
  </div>

  <div class="notice">
    商品のブランド品番を同一商品の照合に活用するための試作版です。価格・在庫・販売状況は販売ページでご確認ください。
  </div>

  <div class="head">
    <strong>商品一覧</strong>
    <span class="muted" id="count">検索キーワードを入力してください</span>
  </div>

  <div id="products" class="grid">
    <div class="empty">商品名やブランド名を入力して検索してください。</div>
  </div>
</main>

<footer>FASHION PRICE｜ファッション価格比較</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="dialog">
    <button class="close" id="close" type="button">閉じる ✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBrand" class="muted"></div>
    <div id="modalCode" class="code"></div>
    <div id="modalBrandCode" class="code brand-code"></div>
    <div id="modalJanCode" class="code"></div>
    <p id="modalPrice" class="price"></p>
    <div id="modalSource" class="muted"></div>
    <div class="notice">
      ブランド品番は同一商品を照合するための手がかりです。品番が一致しても、カラー・サイズなどの違いを確認してください。
    </div>
    <a id="productLink" class="product-link" href="#" target="_blank" rel="noopener noreferrer">販売ページを開く</a>
  </div>
</div>

<script>
const API_URL = "https://blue-dew-5ca2.kettantanmen.workers.dev/api/search";

const yen = n => "¥" + Number(n || 0).toLocaleString("ja-JP");

const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[ch]));

let currentItems = [];
let requestNumber = 0;

function getCategory(name) {
  if (/バッグ|かばん|鞄|トート/.test(name)) return "バッグ";
  if (/シューズ|スニーカー|パンプス|ブーツ|サンダル|ローファー/.test(name)) return "シューズ";
  if (/パンツ|デニム|ジーンズ|ジーパン|スラックス|ズボン/.test(name)) return "パンツ";
  return "トップス";
}

function getGender(name) {
  if (/メンズ|男性用|男性向け/.test(name)) return "メンズ";
  if (/レディース|女性用|婦人|女性向け/.test(name)) return "レディース";
  return "不明";
}

function normalizeProduct(p, i) {
  return {
    id: i,
    name: p.name || "商品名不明",
    brand: p.shop || "販売店情報なし",
    code: p.code || "",
    brandCode: p.brandCode || "",
    janCode: p.janCode || "",
    gender: getGender(p.name || ""),
    category: getCategory(p.name || ""),
    price: Number(p.price) || 0,
    image: p.image || "",
    url: p.url || "",
    source: p.source || "Yahoo!ショッピング"
  };
}

function showMessage(message) {
  const root = document.getElementById("products");
  root.className = "grid";
  root.innerHTML = '<div class="empty">' + escapeHTML(message) + '</div>';
}

async function render() {
  const q = document.getElementById("query").value.trim();
  const category = document.getElementById("category").value;
  const gender = document.getElementById("gender").value;
  const sort = document.getElementById("sort").value;
  const count = document.getElementById("count");
  const root = document.getElementById("products");
  const thisRequest = ++requestNumber;

  if (!q) {
    currentItems = [];
    count.textContent = "キーワードを入力してください";
    showMessage("商品名やブランド名を入力して検索してください。");
    return;
  }

  count.textContent = "検索中...";
  showMessage("商品情報を取得しています...");

  try {
    const response = await fetch(API_URL + "?q=" + encodeURIComponent(q));
    const data = await response.json();

    if (thisRequest !== requestNumber) return;
    if (!response.ok) throw new Error(data.error || "商品を取得できませんでした。");

    let products = (data.items || [])
      .map(normalizeProduct)
      .filter(p => p.price > 0);

    if (category) products = products.filter(p => p.category === category);
    if (gender) products = products.filter(p => p.gender === gender);

    if (sort === "low") products.sort((a, b) => a.price - b.price);
    if (sort === "high") products.sort((a, b) => b.price - a.price);

    currentItems = products;
    count.textContent = products.length + "件（検索結果）";

    if (!products.length) {
      showMessage("該当する商品がありません。カテゴリ・対象を「すべて」にするか、別のキーワードで検索してください。");
      return;
    }

    root.className = "grid";
    root.innerHTML = products.map(p => `
      <article class="card">
        <div class="photo">
          ${
            p.image
              ? `<img src="${escapeHTML(p.image)}" alt="${escapeHTML(p.name)}" loading="lazy">`
              : "商品画像なし"
          }
        </div>
        <div class="body">
          <div class="brand">${escapeHTML(p.brand)}</div>
          <div class="name">${escapeHTML(p.name)}</div>
          <div class="code">商品コード：${escapeHTML(p.code || "未取得")}</div>
          <div class="code brand-code">ブランド品番：${escapeHTML(p.brandCode || "未取得")}</div>
          <div class="code">JAN/ISBNコード：${escapeHTML(p.janCode || "未取得")}</div>
          <div class="price">${yen(p.price)}</div>
          <div class="muted">販売先：${escapeHTML(p.source)}</div>
          <span class="chip">${escapeHTML(p.category)} · ${escapeHTML(p.gender)}</span>
          <button class="detail" type="button" data-id="${p.id}">商品情報を見る</button>
        </div>
      </article>
    `).join("");

    root.querySelectorAll(".detail").forEach(button => {
      button.addEventListener("click", () => {
        const p = currentItems.find(item => item.id === Number(button.dataset.id));
        if (!p) return;

        document.getElementById("modalTitle").textContent = p.name;
        document.getElementById("modalBrand").textContent = p.brand;
        document.getElementById("modalCode").textContent =
          "商品コード：" + (p.code || "未取得");
        document.getElementById("modalBrandCode").textContent =
          "ブランド品番：" + (p.brandCode || "未取得");
        document.getElementById("modalJanCode").textContent =
          "JAN/ISBNコード：" + (p.janCode || "未取得");
        document.getElementById("modalPrice").textContent = yen(p.price);
        document.getElementById("modalSource").textContent = "販売先：" + p.source;

        const link = document.getElementById("productLink");
        if (p.url && /^https?:\/\//i.test(p.url)) {
          link.href = p.url;
          link.style.display = "block";
        } else {
          link.removeAttribute("href");
          link.style.display = "none";
        }

        document.getElementById("modal").classList.add("open");
      });
    });

  } catch (error) {
    if (thisRequest !== requestNumber) return;
    count.textContent = "検索エラー";
    showMessage((error.message || "商品を取得できませんでした。") + " 時間をおいて再度お試しください。");
  }
}

document.getElementById("searchForm").addEventListener("submit", event => {
  event.preventDefault();
  render();
});

["category", "gender", "sort"].forEach(id => {
  document.getElementById(id).addEventListener("change", render);
});

document.getElementById("close").addEventListener("click", () => {
  document.getElementById("modal").classList.remove("open");
});

document.getElementById("modal").addEventListener("click", event => {
  if (event.target.id === "modal") event.currentTarget.classList.remove("open");
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") document.getElementById("modal").classList.remove("open");
});
</script>
</body>
</html>
