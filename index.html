<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FASHION PRICE｜ファッション価格比較</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;color:#171a21;line-height:1.55}header{border-bottom:1px solid #d8dee8}.wrap,main{max-width:1080px;margin:auto;padding:18px 20px}.logo{font-size:25px;font-weight:800}.logo span{color:#0759c7}.muted{color:#5d6675;font-size:13px}h1{font-size:24px;margin:12px 0 5px}.search{display:flex;gap:8px;margin:22px 0 12px}.search input{flex:1;min-width:0;padding:13px;border:1px solid #9ba6b5;border-radius:6px;font-size:16px}.search button{background:#0759c7;color:white;border:0;border-radius:6px;padding:0 22px;font-weight:bold}.filters{display:flex;gap:15px;flex-wrap:wrap;margin:15px 0}.filters select{padding:8px;border:1px solid #d8dee8;border-radius:5px;background:white}.notice{background:#f0f6ff;border:1px solid #c7dcff;border-radius:6px;padding:11px;font-size:13px;margin:18px 0}.head{display:flex;justify-content:space-between;border-bottom:2px solid #222;padding-bottom:9px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid #d8dee8;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}.photo{height:135px;background:#f0f2f5;display:grid;place-items:center;color:#77808d;font-size:13px}.body{padding:14px;display:flex;flex-direction:column;flex:1}.brand{font-size:12px;color:#5d6675}.name{font-weight:bold;margin:4px 0 10px}.price{font-size:22px;font-weight:bold}.price small{font-size:11px;color:#5d6675;font-weight:normal}.chip{font-size:11px;background:#eef2f7;padding:3px 7px;border-radius:4px;align-self:flex-start;margin-top:8px}.detail{margin-top:13px;padding:9px;border:1px solid #0759c7;background:white;color:#0759c7;border-radius:5px;font-weight:bold;cursor:pointer}.empty{padding:30px;text-align:center;color:#5d6675;border:1px dashed #d8dee8}footer{text-align:center;border-top:1px solid #d8dee8;padding:20px;color:#5d6675;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{background:white;border-radius:10px;padding:22px;max-width:480px;width:100%}.close{float:right;padding:6px;border:0;border-radius:5px}.offer{padding:12px 0;border-bottom:1px solid #d8dee8;display:flex;justify-content:space-between}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:460px){.grid{grid-template-columns:1fr}.wrap,main{padding:14px}.filters{display:grid}.search button{padding:0 14px}}
</style></head><body>
<header><div class="wrap"><div class="logo">FASHION <span>PRICE</span></div><div class="muted">ファッションアイテムの価格比較</div></div></header>
<main><h1>欲しい服を、価格で比べる。</h1><div class="muted">商品名やブランド名で検索して、価格をチェック。</div>
<form class="search" id="searchForm"><input id="query" type="search" placeholder="例：デニム、バッグ、AZUL、ワイドパンツ" aria-label="商品名やブランド名"><button>検索</button></form>
<div class="filters"><label>カテゴリ <select id="category"><option value="">すべて</option><option>トップス</option><option>パンツ</option><option>バッグ</option><option>シューズ</option></select></label><label>対象 <select id="gender"><option value="">すべて</option><option>レディース</option><option>メンズ</option></select></label><label>並び順 <select id="sort"><option value="relevance">おすすめ順</option><option value="low">価格が安い順</option><option value="high">価格が高い順</option></select></label></div>
<div class="notice">※画面確認用のサンプル商品です。実際の販売価格・在庫・ショップ情報とは連動していません。</div><div class="head"><strong>商品一覧</strong><span class="muted" id="count"></span></div><div id="products" class="grid"></div></main>
<footer>FASHION PRICE｜試作版・掲載価格はサンプルです</footer>
<div class="modal" id="modal"><div class="dialog"><button class="close" id="close">閉じる ✕</button><h2 id="modalTitle"></h2><div id="modalBrand" class="muted"></div><p id="modalPrice" class="price"></p><div class="notice">ショップ別の実際の価格取得機能は、今後追加します。</div><div id="offers"></div><p class="muted">商品名が似ているだけでは同一商品と判定せず、商品番号などで確認する設計にします。</p></div></div>
<script>
const items=[
{id:1,brand:"AZUL BY MOUSSY",name:"ハイウエスト ワイドデニムパンツ",category:"パンツ",gender:"レディース",price:5990},
{id:2,brand:"SLY",name:"ストレートデニムパンツ",category:"パンツ",gender:"レディース",price:13990},
{id:3,brand:"rienda",name:"シンプルショルダーバッグ",category:"バッグ",gender:"レディース",price:7700},
{id:4,brand:"AZUL BY MOUSSY",name:"ベーシックロゴTシャツ",category:"トップス",gender:"メンズ",price:2990},
{id:5,brand:"WYM LIDNM",name:"リラックスフィットシャツ",category:"トップス",gender:"メンズ",price:4400},
{id:6,brand:"STACCATO",name:"シンプルフラットシューズ",category:"シューズ",gender:"レディース",price:16500},
{id:7,brand:"参考商品",name:"ベーシックトートバッグ",category:"バッグ",gender:"メンズ",price:3980},
{id:8,brand:"参考商品",name:"ストレートスラックス",category:"パンツ",gender:"メンズ",price:5500},
{id:9,brand:"参考商品",name:"クルーネックニット",category:"トップス",gender:"レディース",price:4950}];
const yen=n=>"¥"+n.toLocaleString("ja-JP");
function render(){const q=document.getElementById("query").value.trim().toLowerCase(),c=document.getElementById("category").value,g=document.getElementById("gender").value,s=document.getElementById("sort").value;let a=items.filter(p=>(!q||(p.name+" "+p.brand+" "+p.category+" "+p.gender).toLowerCase().includes(q))&&(!c||p.category===c)&&(!g||p.gender===g));if(s==="low")a.sort((x,y)=>x.price-y.price);if(s==="high")a.sort((x,y)=>y.price-x.price);document.getElementById("count").textContent=a.length+"件（サンプル）";const root=document.getElementById("products");if(!a.length){root.className="";root.innerHTML='<div class="empty">該当する商品がありません。別のキーワードで検索してみてください。</div>';return}root.className="grid";root.innerHTML=a.map(p=>`<article class="card"><div class="photo">商品画像（準備中）</div><div class="body"><div class="brand">${p.brand}・${p.gender}</div><div class="name">${p.name}</div><div class="price">${yen(p.price)} <small>サンプル</small></div><div class="muted">カテゴリ：${p.category}</div><span class="chip">試作データ</span><button class="detail" data-id="${p.id}">商品情報を見る</button></div></article>`).join("");root.querySelectorAll("button").forEach(b=>b.onclick=()=>detail(+b.dataset.id))}
function detail(id){const p=items.find(x=>x.id===id);document.getElementById("modalTitle").textContent=p.name;document.getElementById("modalBrand").textContent=p.brand+"・"+p.gender;document.getElementById("modalPrice").textContent=yen(p.price)+"（サンプル）";document.getElementById("offers").innerHTML='<div class="offer"><span>サンプル価格</span><strong>'+yen(p.price)+'</strong></div>';document.getElementById("modal").classList.add("open")}
document.getElementById("searchForm").onsubmit=e=>{e.preventDefault();render()};["category","gender","sort"].forEach(id=>document.getElementById(id).onchange=render);document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("open");document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("open")};render();
</script></body></html>
